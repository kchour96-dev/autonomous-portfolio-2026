name: Daily Game Releases & Intel Update

on:
  schedule:
    # Runs everyday at 00:00 UTC (12:00 AM UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run daily agent
        run: python agent_update.py

      - name: Commit and push changes
        run: |
          git config --global user.name "OmniGaming-Bot"
          git config --global user.email "bot@autonomous-portfolio-2026.live"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Daily Steam releases & free games" && git push)
